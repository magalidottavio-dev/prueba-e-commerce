<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Prueba - MODO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      max-width: 420px;
      width: 100%;
    }
    .card h1 { font-size: 20px; margin-bottom: 4px; color: #1a1a1a; }
    .card .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    .product {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; background: #fafafa; border-radius: 8px; margin-bottom: 16px;
    }
    .product-icon {
      width: 56px; height: 56px; background: #e8f5e9; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .product-info { flex: 1; }
    .product-info .name { font-weight: 600; color: #1a1a1a; }
    .product-info .desc { font-size: 13px; color: #888; margin-top: 2px; }
    .price-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-top: 1px solid #eee; margin-bottom: 8px;
    }
    .price-row .label { color: #666; }
    .price-row input {
      width: 100px; padding: 6px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 16px; text-align: right;
    }
    .btn-modo {
      width: 100%; padding: 14px; background: #00b85c; color: white;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 16px; transition: background 0.2s;
    }
    .btn-modo:hover { background: #00a050; }
    .btn-modo:disabled { background: #ccc; cursor: not-allowed; }
    .status {
      margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none;
    }
    .status.error { display: block; background: #fff3f3; color: #d32f2f; }
    .status.info { display: block; background: #f0f7ff; color: #1565c0; }
    .status.success { display: block; background: #f0faf0; color: #2e7d32; }
    .footer {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee;
      font-size: 12px; color: #999; text-align: center;
    }
    .footer code {
      background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 11px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Tienda de Prueba</h1>
  <p class="subtitle">Integración MODO · Redirección al Site de Pagos · Pre-producción</p>

  <div class="product">
    <div class="product-icon">🧪</div>
    <div class="product-info">
      <div class="name">Producto de prueba</div>
      <div class="desc">Para testear el flujo de pago con MODO</div>
    </div>
  </div>

  <div class="price-row">
    <span class="label">Monto (ARS)</span>
    <input type="number" id="amount" value="50.00" min="30" step="0.01">
  </div>

  <button class="btn-modo" id="btnPagar" onclick="goToCheckout()">
    Pagá con MODO
  </button>

  <div class="status" id="status"></div>

  <div class="footer">
    Entorno: <code>preprod</code> ·
    Gateway: <code>Decidir Plus</code> ·
    CC: <code>1CSI</code>
  </div>
</div>

<script>
  // Base del site de pagos de MODO según el ambiente.
  // Pre-producción: https://site.preprod.modo.com.ar/checkout
  // Producción:      https://site.modo.com.ar/checkout
  const MODO_SITE_PAGOS_URL = 'https://site.preprod.modo.com.ar/checkout';

  const statusEl = document.getElementById('status');
  const btnEl = document.getElementById('btnPagar');

  function setStatus(msg, type) {
    statusEl.className = 'status ' + type;
    statusEl.textContent = msg;
  }

  // 1. Pide al backend del e-commerce que genere el payment request contra MODO.
  async function createPaymentRequest() {
    const amount = parseFloat(document.getElementById('amount').value) || 50;
    setStatus('Creando intención de cobro...', 'info');

    const res = await fetch('/api/modo-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, description: 'Compra de prueba - $' + amount }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Error al crear payment request');
    }

    const data = await res.json();
    return data.id;
  }

  // 2. Redirige al site de pagos de MODO con el id y las URLs de retorno.
  async function goToCheckout() {
    try {
      btnEl.disabled = true;
      btnEl.textContent = 'Redirigiendo...';

      const paymentRequestId = await createPaymentRequest();

      const callbackSuccess = window.location.origin + window.location.pathname + '?status=success';
      const callback = window.location.origin + window.location.pathname + '?status=error';

      const url = new URL(MODO_SITE_PAGOS_URL);
      url.searchParams.set('id', paymentRequestId);
      url.searchParams.set('callbackSuccess', callbackSuccess);
      url.searchParams.set('callback', callback);

      window.location.href = url.toString();

    } catch (error) {
      setStatus('Error: ' + error.message, 'error');
      btnEl.disabled = false;
      btnEl.textContent = 'Pagá con MODO';
    }
  }

  // Al volver desde el site de pagos (callback / callbackSuccess), muestra el resultado.
  // El reintento es manual: si falló, el usuario vuelve a tocar "Pagá con MODO",
  // lo que genera un payment request NUEVO y redirige de nuevo (ya no hay reintento automático).
  (function handleReturnFromCheckout() {
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');

    if (status === 'success') {
      setStatus('Pago exitoso!', 'success');
    } else if (status === 'error') {
      setStatus('El pago falló o fue abandonado. Podés volver a intentarlo.', 'error');
    }

    if (status) {
      // Limpia el query param para que un refresh no vuelva a mostrar el mismo estado.
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  })();
</script>
</body>
</html>
